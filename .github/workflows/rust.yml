name: CI

on:
  push:
    branches: [rust, main]
    tags: ['v*']
  pull_request:
    branches: [rust, main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ── Lint & Test ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D clippy::all

      - name: Test (lib)
        run: cargo test --lib

      - name: Test (lsp integration)
        run: cargo test --test lsp_integration

      - name: Parity smoke
        run: cargo test --test parity

      - name: Check Windows compilation
        run: cargo check --lib --target x86_64-pc-windows-msvc

  # ── Cross-platform build ────────────────────────────────────
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/rust'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tsox-linux-x64
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: tsox-linux-arm64
            archive: tar.gz
            cross_deps: gcc-aarch64-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tsox-darwin-arm64
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: tsox-darwin-x64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tsox-win32-x64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain (Linux ARM64)
        if: matrix.cross_deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_deps }}

      - name: Configure cross linker (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'TOML'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          TOML

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: matrix.archive != 'zip'
        run: |
          BIN=target/${{ matrix.target }}/release/tsox
          if command -v strip &>/dev/null; then
            strip "$BIN" || true
          fi

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz tsox

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip tsox.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive }}

  # ── npm package ─────────────────────────────────────────────
  npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage binaries into npm/bin
        run: |
          mkdir -p npm/bin
          # Each archive contains a single binary named 'tsox' (or 'tsox.exe').
          # Extract into platform-specific temp dirs, then rename.
          for f in artifacts/*.tar.gz; do
            name=$(basename "$f" .tar.gz)
            # name is like tsox-linux-x64
            platform=${name#tsox-}
            tmp=$(mktemp -d)
            tar xzf "$f" -C "$tmp"
            if [ -f "$tmp/tsox" ]; then
              cp "$tmp/tsox" "npm/bin/tsox-$platform"
              chmod +x "npm/bin/tsox-$platform"
            fi
            rm -rf "$tmp"
          done
          for f in artifacts/*.zip; do
            name=$(basename "$f" .zip)
            platform=${name#tsox-}
            tmp=$(mktemp -d)
            (cd "$tmp" && 7z x "$OLDPWD/$f")
            if [ -f "$tmp/tsox.exe" ]; then
              cp "$tmp/tsox.exe" "npm/bin/tsox-$platform.exe"
            fi
            rm -rf "$tmp"
          done
          # Create the generic entry-point shim (tsgo.js handles dispatch)
          echo '#!/usr/bin/env node' > npm/bin/tsgo
          echo 'import("../lib/tsgo.js")' >> npm/bin/tsgo
          chmod +x npm/bin/tsgo
          ls -la npm/bin/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          npm publish --access public

  # ── GitHub Release ──────────────────────────────────────────
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > ../checksums.txt
          cd ..
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
            checksums.txt

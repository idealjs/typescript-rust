name: Rust CI

on:
  push:
    branches: [rust, main]
  pull_request:
    branches: [rust, main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Rust CI for the tsox (TypeScript Go → Rust port) crate.
# fmt, clippy, test, and parity smoke are all gating.
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D clippy::all

      - name: Test
        run: cargo test --lib

      - name: Parity smoke
        # Runs without the Go oracle; parity tests skip the oracle
        # comparison gracefully and still exercise the Rust smoke cases.
        run: cargo test --test parity

[package]
name = "tsox-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bumpalo = "3"
dashmap = "6"
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
